services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-disposable-password
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ci -d app_ci']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: app-ci:${CI_IMAGE_TAG:?Run from CI or set a local test image tag}
    ports: ['127.0.0.1:8311:8311']
    environment:
      PORT: '8311'
      APP_BIND: 0.0.0.0
      APP_TOKEN: ci-only-workspace-key-not-a-production-secret
      JDBC_URL: jdbc:postgresql://db:5432/app_ci
      DB_USER: ci
      DB_PASSWORD: ci-only-disposable-password
      OLLAMA_MODEL: ''
      OLLAMA_EMBED_MODEL: ''
    depends_on:
      db:
        condition: service_healthy
